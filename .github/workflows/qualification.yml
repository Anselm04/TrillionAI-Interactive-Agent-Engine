name: Foundation qualification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: services/engine
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/demo_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter create --platforms=web --project-name trillionai_interactive_demo .
          flutter build web
